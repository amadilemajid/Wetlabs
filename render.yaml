services:
  - type: web
    name: wetlabs-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build --workspace=@wetlabs/api
    startCommand: cd apps/api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_PRIVATE_KEY_BASE64
        value: 
      - key: JWT_PUBLIC_KEY_BASE64
        value: 
      - key: JWT_EXPIRES_IN
        value: 3600
      - key: MSISDN_PEPPER
        value: 64bc8111a21523b26e8fb544d17196acffaba0619be7a998bb96b1e492f0df68
      - key: AT_USSD_HMAC_SECRET
        value: dummy_AT_hmac_secret
      - key: INTERNAL_API_KEY
        value: eceb056c7444a01effe2a4094557dedcdac57099a18c4f085cbfd4665d1e0177
      - key: CORS_ORIGIN
        value: "*"
      - key: AT_API_KEY
        value: ""
      - key: AT_USERNAME
        value: sandbox
      - key: SENDGRID_API_KEY
        value: ""
      - key: SENTINEL_HUB_CLIENT_ID
        value: ""
      - key: SENTINEL_HUB_CLIENT_SECRET
        value: ""
      - key: S3_BUCKET
        value: wetlabs-photos
      - key: S3_ENDPOINT
        value: https://s3.amazonaws.com
      - key: S3_ACCESS_KEY
        value: ""
      - key: S3_SECRET_KEY
        value: ""
