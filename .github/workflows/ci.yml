name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER:     wetlabs
          POSTGRES_PASSWORD: wetlabs_secret
          POSTGRES_DB:       wetlabs_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build --workspace=packages/shared-types

      - name: Lint
        run: npm run lint --workspace=apps/api

      - name: Run migrations
        run: |
          for f in infra/migrations/V*.sql; do
            psql postgresql://wetlabs:wetlabs_secret@localhost:5432/wetlabs_db -f "$f"
          done

      - name: Run tests with coverage
        run: npm run test --workspace=apps/api
        env:
          NODE_ENV:             test
          DATABASE_URL:         postgresql://wetlabs:wetlabs_secret@localhost:5432/wetlabs_db
          REDIS_URL:            redis://localhost:6379
          RABBITMQ_URL:         amqp://wetlabs:wetlabs_secret@localhost:5672
          JWT_PRIVATE_KEY_BASE64: ${{ secrets.JWT_PRIVATE_KEY_BASE64 }}
          JWT_PUBLIC_KEY_BASE64:  ${{ secrets.JWT_PUBLIC_KEY_BASE64 }}
          MSISDN_PEPPER:        test_pepper_32_bytes_minimum_length
          AT_USSD_HMAC_SECRET:  test_hmac_secret
          INTERNAL_API_KEY:     test_internal_key
          AT_API_KEY:           test_at_key
          SENDGRID_API_KEY:     test_sg_key
          S3_BUCKET:            test-bucket
          S3_ENDPOINT:          https://s3.amazonaws.com

      - name: Dependency security audit
        run: npm audit --audit-level=high

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build shared types
        run: npm run build --workspace=packages/shared-types

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Unit tests
        run: npm run test --workspace=apps/web

      - name: Build (production)
        run: npm run build --workspace=apps/web
        env:
          VITE_API_BASE_URL:         https://api.wetlabs.app/v1
          VITE_MAP_TILE_URL:         https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
          VITE_MAP_SATELLITE_URL:    https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}

      - name: Playwright E2E (viewport tests - NFR-18)
        run: npx playwright install --with-deps && npx playwright test
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://localhost:3000/api/v1
